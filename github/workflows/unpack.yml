name: Unpack zip
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          unzip -q independent-music-player-v2.zip
          rm -rf independent-music-player/.github
          cp -a independent-music-player/. .
          rm -rf independent-music-player independent-music-player-v2.zip
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack project"
          git push
