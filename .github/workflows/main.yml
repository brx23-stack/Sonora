name: Replace with new version
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q sonora.zip -d /tmp/new
          rm -rf /tmp/new/sonora/.github
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name sonora.zip -exec rm -rf {} +
          cp -a /tmp/new/sonora/. .
          rm -f sonora.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Update to Sonora 0.2"
          git push
